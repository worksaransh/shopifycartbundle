name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so prisma generate and typecheck work; tests set their own env in vitest.config.ts.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bundlekit
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bundlekit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bundlekit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations apply to a clean Postgres
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
